<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e7ecf1; --panel:#ffffff; --chrome:#0f2137; --chrome-2:#16304d;
    --ink:#1b2a3a; --muted:#6a7889; --label:#93a1b0; --line:#e2e8ee;
    --pos:#12924e; --neg:#d6423d; --flat:#8a97a5; --accent:#d6423d;
    --pill-good-bg:#dbf1e3; --pill-good-ink:#177a44;
    --pill-bad-bg:#fbe1e1; --pill-bad-ink:#c1352f;
    --pill-warn-bg:#fbeecd; --pill-warn-ink:#9a6a10;
    --pill-neut-bg:#e7edf3; --pill-neut-ink:#5b6b7c;
    --panel2:#f4f7fa; --row-alt:#f7f9fb; --row-hover:#eef3f8;
    --sans:'Inter',system-ui,-apple-system,sans-serif;
    --mono:'Roboto Mono','IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  [data-theme="dark"]{
    /* terminal palette: near-black charcoal, neon data accents */
    --bg:#0c0c0e; --panel:#141417; --panel2:#1a1a1e; --chrome:#0a0a0c; --chrome-2:#17171b;
    --ink:#e8eaed; --muted:#7d8590; --label:#5c636d; --line:#26262b;
    --pos:#3ddc84; --neg:#ff5c57; --flat:#7d8590; --accent:#38bdf8;
    --row-alt:#17171a; --row-hover:#1f1f25;
    --pill-good-bg:#0e2f1e; --pill-good-ink:#3ddc84;
    --pill-bad-bg:#331413; --pill-bad-ink:#ff5c57;
    --pill-warn-bg:#332a10; --pill-warn-ink:#f5c451;
    --pill-neut-bg:#1e1e24; --pill-neut-ink:#9aa4b0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.3;
    -webkit-font-smoothing:antialiased;padding-bottom:40px;transition:background .2s}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  td.num,th{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.1px}
  td.name{font-family:var(--mono)}
  .pos{color:var(--pos);font-weight:500} .neg{color:var(--neg);font-weight:500} .flat{color:var(--flat)}

  /* ---------- top chrome ---------- */
  header{background:var(--chrome);color:#cdd9e6;position:sticky;top:0;z-index:10}
  .bar{display:flex;align-items:center;gap:18px;padding:12px 20px;flex-wrap:wrap}
  main{width:100%}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .mark{background:#2f6df6;color:#fff;font-family:var(--mono);font-weight:700;font-size:12px;
    padding:6px 8px;border-radius:5px;letter-spacing:.5px}
  .logo .title{font-weight:700;font-size:14px;letter-spacing:.4px;color:#fff}
  .logo .sub{font-family:var(--mono);font-size:10.5px;color:#6f8299;letter-spacing:.3px}
  nav{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center}
  nav a{color:#8195ab;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
    padding:7px 11px;border-radius:6px;text-decoration:none;white-space:nowrap}
  nav a.active{color:#fff;border:1px solid #3f6da8;background:#132a44}
  nav a:hover:not(.active):not(.disabled){color:#cdd9e6;background:#132a44}
  nav a.disabled{opacity:.38;cursor:not-allowed}
  .ctrls button.on{color:#4cd08a;border-color:#2f7d55}
  .ctrls{display:flex;align-items:center;gap:8px}
  .ctrls button{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;color:#9fb0c2;
    background:#132a44;border:1px solid #24425f;padding:7px 10px;border-radius:6px;cursor:pointer}
  .ctrls button:hover{color:#fff;border-color:#3f6da8}
  .ctrls .date{font-family:var(--mono);font-size:11px;color:#7f93a8}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block;margin-right:6px}

  /* ---------- layout ---------- */
  main{max-width:1840px;margin:0 auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
  .row{display:grid;gap:14px}
  .row.two-6040{grid-template-columns:1.55fr 1fr}
  .row.two-5050{grid-template-columns:1fr 1fr}
  .panel{box-shadow:0 0 0 1px var(--line);border-radius:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .phead{background:var(--chrome);color:#aebfd0;display:flex;justify-content:space-between;align-items:center;
    padding:9px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .phead .r{color:#6f8299;font-weight:600;letter-spacing:.6px}
  .pbody{padding:14px}

  /* ---------- regime read ---------- */
  .regime{display:grid;grid-template-columns:repeat(6,1fr)}
  .rcell{padding:14px 16px;border-right:1px solid var(--line)}
  .rcell:last-child{border-right:none}
  .rcell .lbl{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--label);margin-bottom:8px}
  .rcell .big{font-size:22px;font-weight:700;letter-spacing:.3px}
  .rcell .note{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:7px}
  .rcell .stack{font-size:12.5px;font-weight:600;line-height:1.5}
  .rcell .stack .dim{color:var(--muted);font-weight:400;font-size:11px}
  .hl .big{font-family:var(--mono)}
  .sep{color:var(--muted);font-weight:400;margin:0 4px}

  /* ---------- index grid ---------- */
  .idx{display:grid;grid-template-columns:repeat(5,1fr);gap:0}
  .idxcol{padding:2px 16px;border-right:1px solid var(--line)}
  .idxcol:last-child{border-right:none}
  .idxcol .tk{font-family:var(--mono);font-weight:700;font-size:15px}
  .idxcol .desc{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--label);margin:1px 0 10px}
  .idxrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;padding:2px 0}
  .idxrow .k{color:var(--muted)}

  /* ---------- breadth ---------- */
  .breadth{display:grid;grid-template-columns:1fr 1fr;gap:2px 26px}
  .bline{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--line)}
  .bline .k{font-size:11.5px;color:var(--muted)}
  .bline .v{font-family:var(--mono);font-weight:600;font-size:13px}

  /* ---------- theme tables ---------- */
  table{width:100%;border-collapse:collapse}
  th{font-size:9.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--label);
    text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
  th.l{text-align:left}
  td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:12.5px}
  tr:last-child td{border-bottom:none}
  td.rank{color:var(--label);font-family:var(--mono);font-size:11px;width:22px}
  td.name{font-weight:600}
  td.name .cnt{color:var(--muted);font-weight:400;font-family:var(--mono);font-size:10.5px;margin-left:6px}
  td.num{text-align:right;font-family:var(--mono);font-weight:600}
  td.score{font-size:14px}
  .pill{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:4px;text-transform:uppercase}
  .pill.good{background:var(--pill-good-bg);color:var(--pill-good-ink)}
  .pill.bad{background:var(--pill-bad-bg);color:var(--pill-bad-ink)}
  .pill.warn{background:var(--pill-warn-bg);color:var(--pill-warn-ink)}
  .pill.neut{background:var(--pill-neut-bg);color:var(--pill-neut-ink)}
  td.st{text-align:right;width:120px}

  @media(max-width:1080px){
    .row.two-6040,.row.two-5050{grid-template-columns:1fr}
    .regime{grid-template-columns:repeat(2,1fr)}
    .rcell{border-bottom:1px solid var(--line)}
    .idx{grid-template-columns:repeat(2,1fr)}
  }

  /* ---------- phone ---------- */
  @media(max-width:700px){
    body{font-size:14px}
    main{padding:10px;gap:10px}
    .bar{padding:10px 12px;gap:10px}
    .logo .title{font-size:13px}
    .logo .sub{font-size:10px}
    /* nav becomes a swipeable strip instead of hiding */
    nav{order:3;flex-basis:100%;justify-content:flex-start;overflow-x:auto;
        flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;
        padding-bottom:2px}
    nav::-webkit-scrollbar{display:none}
    nav a{font-size:11.5px;padding:9px 12px}
    .ctrls{margin-left:auto}
    .ctrls button{padding:9px 11px;font-size:11px}
    .ctrls .date{display:none}
    .regime{grid-template-columns:repeat(2,1fr)}
    .rcell{padding:11px 12px}
    .rcell .big{font-size:19px}
    .idx{grid-template-columns:repeat(2,1fr)}
    .breadth{grid-template-columns:1fr;gap:0}
    .pbody{padding:10px}
    /* tables: trim to what fits a thumb-scrollable screen */
  th,td{padding:8px 10px;border:0;border-bottom:1px solid transparent}
  tbody tr:nth-child(even), table tr:nth-child(even){background:var(--row-alt)}
  table tr:hover{background:var(--row-hover)}
  table{border-collapse:collapse;width:100%}
  th{position:sticky;top:0;background:var(--panel);z-index:1;
     font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--label);
     border-bottom:1px solid var(--line);font-weight:600}
    td.name .cnt{display:none}
    td.rank{width:16px;font-size:10px}
    td.score{font-size:13px}
    .pill{font-size:8.5px;padding:2px 5px}
    /* hide the theme column on ranked tables (3rd col) */
    table tr > th:nth-child(3).l:not(:last-child),
    table tr > td:nth-child(3).name[style]{display:none}
  }
  @media(max-width:430px){
    .regime{grid-template-columns:1fr}
    .idx{grid-template-columns:1fr}
    th,td{padding:7px 4px;font-size:11.5px}
  }
  .uni-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .uni-theme{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--panel2,#0e1e33)}
  .uni-head{font-size:12.5px;font-weight:700;letter-spacing:.02em;margin-bottom:9px;color:var(--fg)}
  .uni-head .cnt{margin-left:7px;font-weight:400;color:var(--muted);font-size:11px}
  .uni-tags{display:flex;flex-wrap:wrap;gap:5px}
  .uni-tags .tag{font-family:var(--mono,monospace);font-size:11.5px;padding:3px 7px;border-radius:5px;
    background:var(--chip,#12263f);color:var(--fg);border:1px solid var(--line)}
  @media(max-width:700px){.uni-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:430px){.uni-grid{grid-template-columns:1fr}}
  .ms-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ms-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel2,#0e1e33)}
  .ms-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .ms-head .tk{font-weight:800;font-size:14px}
  .ms-chk{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;color:var(--fg)}
  @media(max-width:700px){.ms-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:430px){.ms-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-theme="dark">
<header>
  <div class="bar">
    <div class="logo">
      <span class="mark">SMB</span>
      <div>
        <div class="title">MARKET BOARD</div>
        <div class="sub" id="metaline">loading…</div>
      </div>
    </div>
    <nav>
      <a href="#" data-tab="Macro Structure" class="active">Macro Structure</a>
      <a href="#" data-tab="Daily Board">Daily Board</a>
      <a href="#" data-tab="Themes">Themes</a>
      <a href="#" data-tab="Breadth">Breadth</a>
      <a href="#" data-tab="ETF Grid">ETF Grid</a>
      <a href="#" data-tab="RVOL">RVOL</a>
      <a href="#" data-tab="Events">Events</a>
      <a href="#" data-tab="Momentum">Momentum</a>
      <a href="#" data-tab="Extension">Extension</a>
      <a href="#" data-tab="Universe">Universe</a>
      <a href="#" data-tab="Verify">Verify</a>
      <a href="#" data-tab="Clean Momentum">Clean Momentum</a>
    </nav>
    <div class="ctrls">
      <button id="themeBtn">LIGHT</button>
      <button id="liveBtn">● LIVE OFF</button>
      <button id="refreshBtn">⟳ REFRESH</button>
      <span class="date mono" id="dateline">—</span>
    </div>
  </div>
</header>

<main id="main"></main>

<script>

/* =====================================================================
   Live loader. Fetches dashboard_data.json (written by market_ingest.py).
   REFRESH re-fetches. LIVE polls every 60s. Tabs switch views.
   ===================================================================== */
let DATA = null;
let liveTimer = null;
const WORKING_TABS = ["Macro Structure", "Daily Board", "Themes", "Breadth", "ETF Grid", "RVOL", "Momentum", "Extension", "Events", "Universe", "Verify"];
let activeTab = "Macro Structure";

async function load(){
  const el = document.getElementById("metaline");
  try{
    const r = await fetch("dashboard_data.json?t=" + Date.now());   // cache-bust
    if(!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    render();
  }catch(err){
    el.textContent = "LOAD FAILED — " + err.message;
    el.style.color = "#e8746f";
  }
}

/* ---------- helpers ---------- */
const cls = v => v>0?"pos":v<0?"neg":"flat";
const pctSign = v => (v>0?"+":"")+Number(v).toFixed(2)+"%";
const numSign = v => (v>0?"+":"")+Number(v).toFixed(1);
const pillClass = st => ({DOMINANT:"good",STRONG:"good",NEUTRAL:"neut",WEAK:"warn",FADING:"bad",DETERIORATING:"bad"}[st]||"neut");
const scoreColor = s => s>=75?"pos":s>=55?"":s>=35?"warn":"neg";

const themeRows = arr => arr.map(t=>`
    <tr>
      <td class="rank">${t.r}</td>
      <td class="name">${t.name}<span class="cnt">${t.cnt}</span></td>
      <td class="num score ${scoreColor(t.score)}">${t.score}</td>
      <td class="num ${cls(t.delta)}">${numSign(t.delta)}</td>
      <td class="st"><span class="pill ${pillClass(t.st)}">${t.st}</span></td>
    </tr>`).join("");
const THEAD = `<tr><th class="l">#</th><th class="l">Theme</th><th>Score</th><th>1D Δ</th><th>Status</th></tr>`;

/* ---------- views ---------- */
function viewDailyBoard(d){
  const rg = d.regime;
  const emerging = (rg.emerging && rg.emerging.length) ? rg.emerging.join(" · ") : `<span class="dim">${rg.emergingNote||"no themes improving"}</span>`;
  return `
  <section class="panel">
    <div class="phead">Regime Read <span class="r">AS OF ${d.date}</span></div>
    <div class="regime">
      <div class="rcell hl"><div class="lbl">Regime</div>
        <div class="big ${rg.label.includes('OFF')?'neg':rg.label.includes('ON')?'pos':'flat'}">${rg.label}</div>
        <div class="note">${rg.breadth}</div></div>
      <div class="rcell"><div class="lbl">Dominant</div>
        <div class="stack">${rg.dominant[0]||"—"}<br><span class="dim">${rg.dominant.slice(1).join(" · ")}</span></div></div>
      <div class="rcell"><div class="lbl">Emerging</div>
        <div class="stack">${(rg.emerging&&rg.emerging[0])||"—"}<br><span class="dim">${emerging}</span></div></div>
      <div class="rcell"><div class="lbl">Fading</div>
        <div class="stack">${rg.fading[0]||"—"}<br><span class="dim">${rg.fading.slice(1).join(" · ")}</span></div></div>
      <div class="rcell hl"><div class="lbl">New Highs / Lows</div>
        <div class="big"><span class="pos">${rg.newHighs}</span> <span class="sep">/</span> <span class="neg">${rg.newLows}</span></div>
        <div class="note">52w highs: ${rg.highs52w}</div></div>
      <div class="rcell hl"><div class="lbl">Up 3% / Down 3%</div>
        <div class="big"><span class="pos">${rg.up3}</span> <span class="sep">/</span> <span class="neg">${rg.down3}</span></div>
        <div class="note">impulse / volatility</div></div>
    </div>
  </section>

  <div class="row two-6040">
    <section class="panel">
      <div class="phead">Index &amp; Benchmark <span class="r">RET / DIST 50DMA / ATR EXT</span></div>
      <div class="pbody"><div class="idx">${d.indices.map(x=>`
        <div class="idxcol">
          <div class="tk">${x.tk}</div><div class="desc">${x.desc}</div>
          <div class="idxrow"><span class="k">1D</span><span class="${cls(x.d1)}">${pctSign(x.d1)}</span></div>
          <div class="idxrow"><span class="k">5D</span><span class="${cls(x.d5)}">${pctSign(x.d5)}</span></div>
          <div class="idxrow"><span class="k">&gt;50DMA</span><span class="${cls(x.d50)}">${pctSign(x.d50)}</span></div>
          <div class="idxrow"><span class="k">ATR EXT</span><span class="${cls(x.atr)}">${numSign(x.atr)}</span></div>
        </div>`).join("")}</div></div>
    </section>
    <section class="panel">
      <div class="phead">Universe Breadth <span class="r">EX-BENCHMARK</span></div>
      <div class="pbody"><div class="breadth">${d.breadth.map(([k,v])=>`
        <div class="bline"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div></div>
    </section>
  </div>

  <div class="row two-5050">
    <section class="panel">
      <div class="phead">Dominant Themes <span class="r">SCORE / 1D Δ / STATUS</span></div>
      <div class="pbody"><table>${THEAD}${themeRows(d.dominant)}</table></div>
    </section>
    <section class="panel">
      <div class="phead">Emerging &amp; Fading <span class="r">BIGGEST 1D Δ MOVES</span></div>
      <div class="pbody"><table>${THEAD}${themeRows(d.emerging)}</table></div>
    </section>
  </div>`;
}

function viewThemes(d){
  const all = [...d.dominant];
  d.emerging.forEach(t=>{ if(!all.find(x=>x.name===t.name)) all.push(t); });
  all.sort((a,b)=>b.score-a.score);
  const movers = [...all].sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  return `
  <div class="row two-5050">
    <section class="panel">
      <div class="phead">All Themes — by score <span class="r">${all.length} THEMES</span></div>
      <div class="pbody"><table>${THEAD}${themeRows(all)}</table></div>
    </section>
    <section class="panel">
      <div class="phead">All Themes — by 1D move <span class="r">ABS Δ</span></div>
      <div class="pbody"><table>${THEAD}${themeRows(movers)}</table></div>
    </section>
  </div>`;
}

function viewBreadth(d){
  const rg = d.regime;
  return `
  <div class="row two-5050">
    <section class="panel">
      <div class="phead">Universe Breadth <span class="r">EX-BENCHMARK · ${d.tickers} NAMES</span></div>
      <div class="pbody"><div class="breadth">${d.breadth.map(([k,v])=>`
        <div class="bline"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div></div>
    </section>
    <section class="panel">
      <div class="phead">Regime Detail <span class="r">AS OF ${d.date}</span></div>
      <div class="pbody"><div class="breadth">
        <div class="bline"><span class="k">Regime</span><span class="v ${rg.label.includes('OFF')?'neg':rg.label.includes('ON')?'pos':''}">${rg.label}</span></div>
        <div class="bline"><span class="k">Moving-average breadth</span><span class="v">${rg.breadth}</span></div>
        <div class="bline"><span class="k">New 20D highs</span><span class="v pos">${rg.newHighs}</span></div>
        <div class="bline"><span class="k">New 20D lows</span><span class="v neg">${rg.newLows}</span></div>
        <div class="bline"><span class="k">New 52W highs</span><span class="v">${rg.highs52w}</span></div>
        <div class="bline"><span class="k">Up 3%+</span><span class="v pos">${rg.up3}</span></div>
        <div class="bline"><span class="k">Down 3%+</span><span class="v neg">${rg.down3}</span></div>
        <div class="bline"><span class="k">Universe size</span><span class="v">${d.tickers}</span></div>
      </div></div>
    </section>
  </div>

  <section class="panel">
    <div class="phead">Index &amp; Benchmark <span class="r">RET / DIST 50DMA / ATR EXT</span></div>
    <div class="pbody"><div class="idx">${d.indices.map(x=>`
      <div class="idxcol">
        <div class="tk">${x.tk}</div><div class="desc">${x.desc}</div>
        <div class="idxrow"><span class="k">1D</span><span class="${cls(x.d1)}">${pctSign(x.d1)}</span></div>
        <div class="idxrow"><span class="k">5D</span><span class="${cls(x.d5)}">${pctSign(x.d5)}</span></div>
        <div class="idxrow"><span class="k">&gt;50DMA</span><span class="${cls(x.d50)}">${pctSign(x.d50)}</span></div>
        <div class="idxrow"><span class="k">ATR EXT</span><span class="${cls(x.atr)}">${numSign(x.atr)}</span></div>
      </div>`).join("")}</div></div>
  </section>`;
}

/* ---------- generic ranked-table renderer ---------- */
function rankTable(rows, cols){
  const head = `<tr><th class="l">#</th><th class="l">Ticker</th><th class="l">Theme</th>${cols.map(c=>`<th>${c.h}</th>`).join("")}</tr>`;
  const body = rows.map((r,i)=>`
    <tr>
      <td class="rank">${i+1}</td>
      <td class="name">${r.tk}</td>
      <td class="name" style="font-weight:400;color:var(--muted);font-size:11.5px">${r.theme}</td>
      ${cols.map(c=>{
        const v = r[c.k];
        if(v===null||v===undefined) return `<td class="num flat">—</td>`;
        return `<td class="num ${c.signed?cls(v):""}">${c.fmt(v)}</td>`;
      }).join("")}
    </tr>`).join("");
  return `<table>${head}${body}</table>`;
}
const F_PCT = v => (v>0?"+":"")+Number(v).toFixed(1)+"%";
const F_NUM = v => Number(v).toFixed(1);
const F_X   = v => Number(v).toFixed(2)+"×";

function viewEtfGrid(d){
  if(!d.etfs || !d.etfs.length) return emptyPanel("ETF Grid", "no ETF data in this JSON — re-run market_ingest.py");
  return `
  <section class="panel">
    <div class="phead">ETF Grid <span class="r">RET / DIST 50DMA / ATR EXT</span></div>
    <div class="pbody"><table>
      <tr><th class="l">ETF</th><th class="l">Sector</th><th>1D</th><th>5D</th><th>21D</th><th>&gt;50DMA</th><th>ATR EXT</th></tr>
      ${d.etfs.map(x=>`
        <tr>
          <td class="name mono">${x.tk}</td>
          <td class="name" style="font-weight:400;color:var(--muted);font-size:11.5px">${x.desc}</td>
          <td class="num ${cls(x.d1)}">${pctSign(x.d1)}</td>
          <td class="num ${cls(x.d5)}">${pctSign(x.d5)}</td>
          <td class="num ${cls(x.d21)}">${pctSign(x.d21)}</td>
          <td class="num ${cls(x.d50)}">${numSign(x.d50)}%</td>
          <td class="num ${cls(x.atr)}">${numSign(x.atr)}</td>
        </tr>`).join("")}
    </table></div>
  </section>`;
}

function viewEvents(d){
  const macro = d.macro && d.macro.length ? `
    <section class="panel">
      <div class="phead">Cross-Asset <span class="r">1D / 5D / 21D / DIST 50DMA</span></div>
      <div class="pbody"><div class="idx">${d.macro.map(x=>`
        <div class="idxcol">
          <div class="tk">${x.tk}</div><div class="desc">${x.desc}</div>
          <div class="idxrow"><span class="k">1D</span><span class="${cls(x.d1)}">${pctSign(x.d1)}</span></div>
          <div class="idxrow"><span class="k">5D</span><span class="${cls(x.d5)}">${pctSign(x.d5)}</span></div>
          <div class="idxrow"><span class="k">21D</span><span class="${cls(x.d21)}">${pctSign(x.d21)}</span></div>
          <div class="idxrow"><span class="k">&gt;50DMA</span><span class="${cls(x.d50)}">${numSign(x.d50)}%</span></div>
        </div>`).join("")}</div></div>
    </section>` : emptyPanel("Cross-Asset", "no macro data — re-run market_ingest.py");

  let earn;
  if(d.earnings && d.earnings.length){
    const today = new Date(d.date);
    const wk = d.earnings.filter(e=>{ const dd=(new Date(e.date)-today)/86400000; return dd>=0 && dd<=7; });
    const later = d.earnings.filter(e=>{ const dd=(new Date(e.date)-today)/86400000; return dd>7; });
    const rowsFor = list => list.map(e=>`
      <tr>
        <td class="name mono">${e.tk}</td>
        <td class="name" style="font-weight:400;color:var(--muted);font-size:11.5px">${e.theme}</td>
        <td class="num mono">${e.date}</td>
      </tr>`).join("");
    earn = `
    <div class="row two-5050">
      <section class="panel">
        <div class="phead">Earnings — next 7 days <span class="r">${wk.length} NAMES</span></div>
        <div class="pbody">${wk.length ? `<table><tr><th class="l">Ticker</th><th class="l">Theme</th><th>Date</th></tr>${rowsFor(wk)}</table>`
          : `<span class="dim" style="color:var(--muted)">nothing in your universe reports this week</span>`}</div>
      </section>
      <section class="panel">
        <div class="phead">Earnings — upcoming <span class="r">${later.length} NAMES</span></div>
        <div class="pbody"><table><tr><th class="l">Ticker</th><th class="l">Theme</th><th>Date</th></tr>${rowsFor(later.slice(0,40))}</table></div>
      </section>
    </div>`;
  } else {
    earn = emptyPanel("Earnings", "no earnings dates yet — run market_ingest.py (fetches on a real run, not selftest)");
  }
  return macro + earn;
}

function viewUniverse(d){
  if(!d.universe_map || !d.universe_map.length)
    return emptyPanel("Universe", "no universe data — re-run market_ingest.py");
  const total = d.universe_map.reduce((a,t)=>a+t.tickers.length,0);
  const blocks = d.universe_map.map(t=>`
    <div class="uni-theme" data-tickers="${t.tickers.join(' ').toLowerCase()} ${t.theme.toLowerCase()}">
      <div class="uni-head">${t.theme}<span class="cnt">${t.tickers.length}</span></div>
      <div class="uni-tags">${t.tickers.map(tk=>`<span class="tag" data-tk="${tk.toLowerCase()}">${tk}</span>`).join("")}</div>
    </div>`).join("");
  return `
  <section class="panel">
    <div class="phead">Universe <span class="r">${total} NAMES · ${d.universe_map.length} THEMES</span></div>
    <div class="pbody">
      <input id="uniFilter" placeholder="filter ticker or theme…" autocomplete="off"
        style="width:100%;box-sizing:border-box;margin-bottom:12px;padding:9px 11px;
        background:var(--panel2,#0e1e33);border:1px solid var(--line);border-radius:8px;
        color:var(--fg);font-size:13px;font-family:inherit">
      <div id="uniWrap" class="uni-grid">${blocks}</div>
    </div>
  </section>`;
}

function viewVerify(d){
  if(!d.verify_map || !Object.keys(d.verify_map).length)
    return emptyPanel("Verify", "no per-ticker data — re-run market_ingest.py");
  return `
  <section class="panel">
    <div class="phead">Verify <span class="r">DATA AS-OF ${d.date} · CHECK vs YAHOO</span></div>
    <div class="pbody">
      <input id="vfInput" placeholder="type a ticker (e.g. NVDA) and press Enter" autocomplete="off"
        style="width:100%;box-sizing:border-box;margin-bottom:12px;padding:9px 11px;text-transform:uppercase;
        background:var(--panel2,#0e1e33);border:1px solid var(--line);border-radius:8px;color:var(--fg);font-size:13px;font-family:inherit">
      <div id="vfOut"><span class="dim" style="color:var(--muted)">Compare the close and 1D against Yahoo for ${d.date}. Data is as-of the last ingest, not live.</span></div>
    </div>
  </section>`;
}

function renderVerify(tk){
  const d = DATA, out = document.getElementById("vfOut");
  const m = d.verify_map[tk];
  if(!m){ out.innerHTML = `<span class="neg">${tk} not in universe (or no data).</span>`; return; }
  const yn = b => b===true?'<span class="pos">yes</span>':b===false?'<span class="neg">no</span>':'<span class="flat">n/a</span>';
  const sp = v => v===null||v===undefined?'<span class="flat">n/a</span>':`<span class="${cls(v)}">${pctSign(v)}</span>`;
  const nn = (v,su='')=>v===null||v===undefined?'<span class="flat">n/a</span>':`${Number(v).toFixed(2)}${su}`;
  out.innerHTML = `
    <table>
      <tr><th class="l">${tk}</th><th class="l">value</th></tr>
      <tr><td class="name">Close</td><td class="num mono">${nn(m.close)}</td></tr>
      <tr><td class="name">1D return</td><td class="num">${sp(m.d1)}</td></tr>
      <tr><td class="name">5D return</td><td class="num">${sp(m.d5)}</td></tr>
      <tr><td class="name">21D return</td><td class="num">${sp(m.d21)}</td></tr>
      <tr><td class="name">63D return</td><td class="num">${sp(m.d63)}</td></tr>
      <tr><td class="name">Dist from 50DMA</td><td class="num">${sp(m.dist50)}</td></tr>
      <tr><td class="name">ATR extension</td><td class="num">${nn(m.atr)}</td></tr>
      <tr><td class="name">Rel. volume</td><td class="num mono">${nn(m.rvol,'×')}</td></tr>
      <tr><td class="name">Above 50DMA</td><td class="num">${yn(m.a50)}</td></tr>
      <tr><td class="name">Above 200DMA</td><td class="num">${yn(m.a200)}</td></tr>
      <tr><td class="name">New 20D high / low</td><td class="num">${yn(m.nh20)} / ${yn(m.nl20)}</td></tr>
    </table>
    <div class="dim" style="color:var(--muted);margin-top:10px;font-size:11.5px">
      Cross-check Close and 1D against Yahoo Finance for ${d.date}. Closes are split/dividend-adjusted.</div>`;
}

function attachVerify(){
  const box = document.getElementById("vfInput");
  if(!box) return;
  const go = () => { const t = box.value.trim().toUpperCase(); if(t) renderVerify(t); };
  box.onkeydown = e => { if(e.key === "Enter") go(); };
  box.oninput = () => { const t = box.value.trim().toUpperCase(); if(DATA.verify_map[t]) renderVerify(t); };
}

function sparkline(hist, lo, hi){
  if(!hist || hist.length < 2) return "";
  const w = 140, h = 34, n = hist.length;
  const x = i => (i / (n - 1)) * (w - 4) + 2;
  const y = v => h - 3 - ((v - lo) / (hi - lo)) * (h - 6);
  const pts = hist.map((p, i) => `${x(i).toFixed(1)},${y(p.score).toFixed(1)}`).join(" ");
  const zero = y(0).toFixed(1);
  const last = hist[n - 1].score;
  return `<svg width="${w}" height="${h}" style="overflow:visible">
    <line x1="2" y1="${zero}" x2="${w-2}" y2="${zero}" stroke="var(--line)" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="${last >= 0 ? "#4cd08a" : "#e8746f"}" stroke-width="1.6"/>
    <circle cx="${x(n-1).toFixed(1)}" cy="${y(last).toFixed(1)}" r="2.4" fill="${last >= 0 ? "#4cd08a" : "#e8746f"}"/>
  </svg>`;
}

let chartRange = 260;   // sessions shown; null = all

function setChartRange(n){
  chartRange = n;
  const host = document.getElementById("regimeChartHost");
  if(host && DATA) host.innerHTML = regimeChartInner(DATA.macro_structure.regime_history);
}

function regimeChart(hist){
  if(!hist || hist.length < 5) return "";
  const opts = [[130,"6M"],[260,"1Y"],[520,"2Y"],[null,"All"]]
    .filter(o => o[0] === null || o[0] <= Math.max(hist.length, 130));
  return `
  <section class="panel">
    <div class="phead">SPX vs Regime
      <span class="r">
        ${opts.map(o => `<button onclick="setChartRange(${o[0]})"
           style="background:none;border:1px solid var(--line);color:var(--muted);
                  border-radius:5px;padding:2px 7px;margin-left:4px;font-size:10.5px;
                  font-family:inherit;cursor:pointer">${o[1]}</button>`).join("")}
      </span></div>
    <div class="pbody" id="regimeChartHost" style="overflow-x:auto">${regimeChartInner(hist)}</div>
  </section>`;
}

function regimeChartInner(hist){
  if(!hist || hist.length < 5) return "";
  let pts = hist.filter(h => h.spx !== null && h.spx !== undefined);
  if(chartRange && pts.length > chartRange) pts = pts.slice(-chartRange);
  if(pts.length < 5) return "";
  const W = Math.max(900, Math.min(2400, pts.length * 3.4)), H = 260, PL = 46, PR = 12, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const px = pts.map(p => p.spx);
  const lo = Math.min(...px), hi = Math.max(...px);
  const pad = (hi - lo) * 0.06 || 1;
  const yLo = lo - pad, yHi = hi + pad;
  const X = i => PL + (i / (pts.length - 1)) * iw;
  const Y = v => PT + ih - ((v - yLo) / (yHi - yLo)) * ih;
  const col = st => st.includes("Risk-On") ? "var(--pos,#2f7d55)"
                  : st === "Full Risk-Off" ? "var(--neg,#8c3630)" : "var(--muted,#3a4a5e)";
  const bw = iw / pts.length + 0.6;

  // background bands: one rect per bar, merged visually by adjacency
  const bands = pts.map((p,i) =>
    `<rect x="${X(i).toFixed(1)}" y="${PT}" width="${bw.toFixed(2)}" height="${ih}" fill="${col(p.status)}" opacity="${p.status==="Neutral / Choppy"?0.16:0.34}"/>`
  ).join("");

  const line = pts.map((p,i) => `${X(i).toFixed(1)},${Y(p.spx).toFixed(1)}`).join(" ");
  // y axis ticks
  const ticks = [0,0.5,1].map(f => {
    const v = yLo + f*(yHi-yLo);
    return `<line x1="${PL}" y1="${Y(v).toFixed(1)}" x2="${W-PR}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="0.5" opacity="0.5"/>
            <text x="${PL-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--muted)">${v.toFixed(0)}</text>`;
  }).join("");
  // x labels: first, middle, last
  const xl = [0, Math.floor(pts.length/2), pts.length-1].map(i =>
    `<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="9.5" fill="var(--muted)">${pts[i].d}</text>`
  ).join("");

  return `
      <div class="dim" style="color:var(--muted);font-size:11px;margin-bottom:4px">${pts.length} sessions · ${pts[0].d} → ${pts[pts.length-1].d} · background = regime</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${Math.min(1600, Math.max(560, pts.length*2.2)).toFixed(0)}px;height:auto;display:block">
        ${bands}${ticks}
        <polyline points="${line}" fill="none" stroke="var(--fg,#e6edf3)" stroke-width="1.6"/>
        ${xl}
      </svg>
      <div style="display:flex;gap:16px;font-size:11.5px;margin-top:8px;flex-wrap:wrap">
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--pos,#2f7d55);opacity:.34;margin-right:5px"></span>Risk-On</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--muted,#3a4a5e);opacity:.16;margin-right:5px"></span>Neutral</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--neg,#8c3630);opacity:.34;margin-right:5px"></span>Risk-Off</span>
        <span class="dim" style="color:var(--muted)">line = SPY close</span>
      </div>`;
}

function volCurve(vol){
  if(!vol || !vol.segments) return "";
  const tenors = [["9D", vol.vix9d], ["30D", vol.vix_close], ["3M", vol.vix3m_close], ["6M", vol.vix6m]]
                 .filter(t => t[1] !== null && t[1] !== undefined);
  if(tenors.length < 2) return "";
  const W = 420, H = 150, PL = 34, PR = 14, PT = 16, PB = 26;
  const iw = W-PL-PR, ih = H-PT-PB;
  const vals = tenors.map(t => t[1]);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi-lo)*0.25 || 1;
  const yl = lo-pad, yh = hi+pad;
  const X = i => PL + (i/(tenors.length-1))*iw;
  const Y = v => PT + ih - ((v-yl)/(yh-yl))*ih;
  const stroke = vol.curve === "contango" ? "var(--pos,#4cd08a)"
               : vol.curve === "backwardated" ? "var(--neg,#e8746f)" : "#e0b341";
  const pts = tenors.map((t,i) => `${X(i).toFixed(1)},${Y(t[1]).toFixed(1)}`).join(" ");
  const dots = tenors.map((t,i) =>
    `<circle cx="${X(i).toFixed(1)}" cy="${Y(t[1]).toFixed(1)}" r="3" fill="${stroke}"/>
     <text x="${X(i).toFixed(1)}" y="${(Y(t[1])-9).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="var(--fg)">${t[1].toFixed(1)}</text>
     <text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${t[0]}</text>`).join("");
  const label = {contango:"CONTANGO (calm)", "front-inverted":"FRONT INVERTED (early stress)",
                 flat:"FLAT / MIXED", backwardated:"BACKWARDATED (stress)", unknown:"—"}[vol.curve] || vol.curve;
  const chk = ok => ok ? '<span class="pos">✓</span>' : '<span class="neg">✗</span>';
  const vvixTxt = (vol.vvix !== null && vol.vvix !== undefined)
    ? `VVIX ${vol.vvix.toFixed(1)}${vol.vvix_10d_ago ? ` <span class="dim" style="color:var(--muted)">vs ${vol.vvix_10d_ago.toFixed(1)} 10d ago</span> ${vol.vvix < vol.vvix_10d_ago ? '<span class="pos">falling</span>' : '<span class="neg">rising</span>'}` : ""}`
    : "";
  return `
  <section class="panel">
    <div class="phead">Volatility Term Structure <span class="r">9D · 30D · 3M · 6M</span></div>
    <div class="pbody" style="display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto">
        <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2"/>
        ${dots}
      </svg>
      <div style="flex:1;min-width:220px">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px" class="${vol.curve==='contango'?'pos':vol.curve==='backwardated'?'neg':''}">${label}</div>
        ${vol.segments.map(sg => `<div style="font-size:12.5px;padding:2px 0">${sg.known?chk(sg.ok):'<span class="flat">—</span>'} ${sg.pair} <span class="dim" style="color:var(--muted)">${sg.known?(sg.ok?"contango":"inverted"):"n/a"}</span></div>`).join("")}
        <div style="font-size:12px;margin-top:9px">${vvixTxt}</div>
        <div style="font-size:11.5px;margin-top:9px;color:var(--muted)">
          Curve inverts from the front first. One inverted segment = early stress (−1);
          two or more = broad stress (−2). A healthy curve falls back to the VIX level.</div>
      </div>
    </div>
  </section>`;
}

function viewMacroStructure(d){
  const ms = d.macro_structure;
  if(!ms) return emptyPanel("Macro Structure", "no macro data in this JSON — re-run market_ingest.py (new tickers need --backfill)");
  const g = ms.global_regime, vol = ms.volatility, health = ms.system_health;
  const regCls = g.status.includes("Risk-On") ? "pos" : g.status.includes("Risk-Off") ? "neg" : "flat";
  const chk = ok => ok ? '<span class="pos">✓</span>' : '<span class="neg">✗</span>';
  const sc  = v => v>0?`<span class="pos">+${Number(v).toFixed(2).replace(/\.00$/,'')}</span>`:v<0?`<span class="neg">${Number(v).toFixed(2).replace(/\.00$/,'')}</span>`:`<span class="flat">0</span>`;
  const spd = v => v===null||v===undefined ? '<span class="flat">—</span>' : `<span class="${v>0?'pos':v<0?'neg':'flat'}">${v>0?'+':''}${Number(v).toFixed(2)}%</span>`;

  const banner = `
  <section class="panel">
    <div class="phead">Global Macro Regime <span class="r">${health.data_status === "stale" ? '<span class="neg">DATA STALE</span> · ' : ''}AS OF ${ms.updated_at}</span></div>
    <div class="pbody" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <div class="big ${regCls}" style="font-size:26px;font-weight:800">${g.status}</div>
      <div style="font-size:15px" class="mono">score ${g.score > 0 ? "+" + g.score : g.score}
        ${g.delta_1d ? `<span class="${g.delta_1d>0?'pos':'neg'}" style="font-size:12px">(${g.delta_1d>0?'+':''}${g.delta_1d} 1D)</span>` : ""}
        <span class="dim" style="color:var(--muted);font-size:12px">(${g.min} to +${g.max}${g.bands ? `; risk-on ≥ ${g.bands.moderate_on}, full ≥ ${g.bands.full_on}` : ""})</span></div>
      <div style="font-size:13px" class="mono">VIX ${vol.vix_close ?? "—"}${vol.vix3m_close ? ` / 3M ${vol.vix3m_close}` : ""}
        ${vol.curve && vol.curve !== "contango" ? `<span class="neg" style="font-weight:700"> ${vol.curve.toUpperCase()}</span>` : vol.curve === "contango" ? '<span class="pos"> contango</span>' : ""} → ${sc(vol.score)}</div>
      ${sparkline(ms.score_history, g.min, g.max)}
    </div>
    <div class="pbody" style="border-top:1px solid var(--line);display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px">
      ${ms.absolute_trend ? `
        <div><span class="dim" style="color:var(--muted)">SPY vs 200SMA</span>
          <span class="mono ${ms.absolute_trend.trend_score>0?'pos':'neg'}"> ${ms.absolute_trend.spy_vs_200sma_pct>0?'+':''}${ms.absolute_trend.spy_vs_200sma_pct ?? '—'}%</span>
          ${sc(ms.absolute_trend.trend_score)}</div>
        <div><span class="dim" style="color:var(--muted)">Breadth &gt;200DMA</span>
          <span class="mono ${ms.absolute_trend.breadth_score>0?'pos':'neg'}"> ${ms.absolute_trend.breadth_pct200 ?? '—'}%</span>
          ${sc(ms.absolute_trend.breadth_score)}</div>` : ""}
      ${g.components ? `
        <div><span class="dim" style="color:var(--muted)">Drivers</span>
          <span class="mono" style="font-size:11.5px"> intermarket ${sc(g.components.intermarket)} · vix ${sc(g.components.vix)} · trend ${sc(g.components.trend)} · breadth ${sc(g.components.breadth)}</span></div>` : ""}
      ${g.dwell_held ? `
        <div><span class="warn" style="color:var(--pill-warn-ink,#f5c451);font-weight:700">⏱ DWELL HOLD</span>
          <span class="dim" style="color:var(--muted);font-size:11.5px"> — risk-off held ${g.prev_run_days}/${g.min_dwell_off} sessions; score alone would have exited</span></div>` : ""}
      ${g.exit_unconfirmed ? `
        <div><span class="neg" style="font-weight:700">⚠ EXIT UNCONFIRMED</span>
          <span class="dim" style="color:var(--muted);font-size:11.5px"> — left risk-off while cross-asset signals kept falling</span></div>` : ""}
      ${g.breadth_engine_regime ? `
        <div><span class="dim" style="color:var(--muted)">Breadth engine</span>
          <span class="mono"> ${g.breadth_engine_regime}</span>
          ${g.agrees === false ? '<span class="neg" style="font-weight:700"> ⚠ DIVERGENCE</span>' : g.agrees === true ? '<span class="pos"> agree</span>' : ""}</div>` : ""}
    </div>
  </section>`;

  const cards = `
  <div class="ms-grid">
    ${ms.asset_engines.map(e => `
      <div class="ms-card">
        <div class="ms-head"><span class="tk">${e.ticker}</span>
          <span class="pill ${e.n >= 3 ? "good" : e.n === 2 ? "neut" : "bad"}">${e.score}</span></div>
        ${e.checks.map(c => `<div class="ms-chk">${chk(c.pass)} <span>${c.label}</span></div>`).join("")}
      </div>`).join("")}
  </div>`;

  const rows = ms.intermarket_ratios.map(r => `
    <tr>
      <td class="name mono">${r.pair}${r.inverted ? ' <span class="dim" style="color:var(--muted);font-size:10px">INV</span>' : ""}</td>
      <td class="name" style="font-weight:400;color:var(--muted);font-size:11.5px">${r.label}</td>
      <td class="num mono">${r.value}</td>
      <td class="num">${r.direction === "up" ? '<span class="pos">▲ 5>21</span>' : '<span class="neg">▼ 5<21</span>'}</td>
      <td class="num mono" style="font-size:11.5px">${r.age_days ?? "—"}d${r.age_days !== undefined && r.age_days <= 3 ? ' <span class="pos" style="font-size:9px">NEW</span>' : ""}</td>
      <td class="num mono" style="font-size:11.5px">${r.weight !== undefined ? (r.weight*100).toFixed(0)+"%" : "—"}</td>
      <td class="num">${sc(r.weighted_score !== undefined ? r.weighted_score : r.score)}</td>
      <td class="num flat">—</td><td class="num flat">—</td>
    </tr>`).join("")
  + ms.relative_valuation.map(v => `
    <tr>
      <td class="name mono">${v.ticker} vs SPY</td>
      <td class="name" style="font-weight:400;color:var(--muted);font-size:11.5px">Relative performance</td>
      <td class="num flat">—</td><td class="num flat">—</td><td class="num flat">—</td><td class="num flat">—</td><td class="num flat">—</td>
      <td class="num">${spd(v.spread_1m)}</td>
      <td class="num">${spd(v.spread_3m)}</td>
    </tr>`).join("");

  const table = `
  <section class="panel">
    <div class="phead">Intermarket Ratios &amp; Relative Performance <span class="r">5/21 EMA CROSS · SPREADS vs SPY</span></div>
    <div class="pbody" style="overflow-x:auto">
      <table style="min-width:760px">
        <tr><th class="l">Pair</th><th class="l">Meaning</th><th>Value</th><th>EMA Cross</th><th>Age</th><th>Conv</th><th>Score</th><th>1M Spread</th><th>3M Spread</th></tr>
        ${rows}
      </table>
    </div>
  </section>`;

  return banner + regimeChart(ms.regime_history) + volCurve(ms.volatility) + cards + table;
}

function emptyPanel(title, msg){
  return `<section class="panel"><div class="phead">${title}</div>
    <div class="pbody"><span class="dim" style="color:var(--muted)">${msg}</span></div></section>`;
}

/* ---------- render ---------- */
function render(){
  if(!DATA) return;
  const d = DATA;
  const el = document.getElementById("metaline");
  el.style.color = "";
  el.textContent = `${d.date} · ${d.tickers} TICKERS · ${d.universe}`;
  document.getElementById("dateline").textContent = d.date;

  document.querySelectorAll("nav a").forEach(a=>{
    a.classList.toggle("active", a.dataset.tab === activeTab);
    a.classList.toggle("disabled", !WORKING_TABS.includes(a.dataset.tab));
  });

  const main = document.getElementById("main");
  if(activeTab === "Macro Structure") main.innerHTML = viewMacroStructure(d);
  else if(activeTab === "Themes")         main.innerHTML = viewThemes(d);
  else if(activeTab === "Breadth")   main.innerHTML = viewBreadth(d);
  else if(activeTab === "ETF Grid")  main.innerHTML = viewEtfGrid(d);
  else if(activeTab === "RVOL")      main.innerHTML = viewRvol(d);
  else if(activeTab === "Momentum")  main.innerHTML = viewMomentum(d);
  else if(activeTab === "Extension") main.innerHTML = viewExtension(d);
  else if(activeTab === "Events")    main.innerHTML = viewEvents(d);
  else if(activeTab === "Universe")  { main.innerHTML = viewUniverse(d); attachUniFilter(); }
  else if(activeTab === "Verify")    { main.innerHTML = viewVerify(d); attachVerify(); }
  else                               main.innerHTML = viewDailyBoard(d);
}

function attachUniFilter(){
  const box = document.getElementById("uniFilter");
  if(!box) return;
  box.oninput = () => {
    const q = box.value.trim().toLowerCase();
    document.querySelectorAll(".uni-theme").forEach(th=>{
      let any = false;
      th.querySelectorAll(".tag").forEach(tag=>{
        const hit = !q || tag.dataset.tk.includes(q);
        tag.style.display = hit ? "" : "none";
        if(hit) any = true;
      });
      const themeMatch = th.dataset.tickers.includes(q);
      th.style.display = (any || themeMatch) ? "" : "none";
      if(themeMatch && q) th.querySelectorAll(".tag").forEach(t=>t.style.display="");
    });
  };
}

/* ---------- controls ---------- */
document.getElementById("themeBtn").onclick = () => {
  const dark = document.body.getAttribute("data-theme")==="dark";
  document.body.setAttribute("data-theme", dark?"light":"dark");
  document.getElementById("themeBtn").textContent = dark?"DARK":"LIGHT";
};

document.getElementById("refreshBtn").onclick = () => load();

document.getElementById("liveBtn").onclick = function(){
  if(liveTimer){
    clearInterval(liveTimer); liveTimer = null;
    this.textContent = "● LIVE OFF"; this.classList.remove("on");
  }else{
    liveTimer = setInterval(load, 60000);
    this.textContent = "● LIVE ON"; this.classList.add("on");
    load();
  }
};

document.querySelectorAll("nav a").forEach(a=>{
  a.onclick = e => {
    e.preventDefault();
    if(!WORKING_TABS.includes(a.dataset.tab)) return;
    activeTab = a.dataset.tab;
    render();
  };
});

load();

</script>
</body>
</html>
